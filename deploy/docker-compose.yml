# Production stack: nginx+web, api, postgres. Copy deploy/.env.example to deploy/.env on the host.
# Images come from the registry (CI builds them); `docker compose -f docker-compose.yml -f docker-compose.build.yml`
# builds locally instead.
name: investagent

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investagent}
      POSTGRES_USER: ${POSTGRES_USER:-investagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investagent} -d ${POSTGRES_DB:-investagent}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-investagent-api:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INVEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-investagent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-investagent}
      INVEST_JWT_SECRET: ${INVEST_JWT_SECRET:?set INVEST_JWT_SECRET in deploy/.env}
      INVEST_JWT_TTL_HOURS: ${INVEST_JWT_TTL_HOURS:-72}
      INVEST_ALLOW_REGISTRATION: ${INVEST_ALLOW_REGISTRATION:-true}
      INVEST_MAX_CONCURRENT_RUNS: ${INVEST_MAX_CONCURRENT_RUNS:-2}
      INVEST_CORS_ORIGINS: ${INVEST_CORS_ORIGINS:-}
      INVEST_LOG_LEVEL: ${INVEST_LOG_LEVEL:-info}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in deploy/.env}
      USE_REAL_DATA: ${USE_REAL_DATA:-true}
      PLANNER_OUTPUT_MODE: ${PLANNER_OUTPUT_MODE:-tool_calling}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    volumes:
      - apiruntime:/app/runtime
    expose:
      - "8000"

  web:
    image: ${WEB_IMAGE:-investagent-web:local}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
  apiruntime:
